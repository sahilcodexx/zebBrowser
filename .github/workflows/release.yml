name: Release AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    # Ubuntu 24.04 (noble) is required: WebKitGTK 6.0 is not in 22.04's repos.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libadwaita-1-dev \
            fuse \
            wget \
            curl \
            file \
            patchelf \
            binutils \
            desktop-file-utils \
            libfuse2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Download linuxdeploy + gtk plugin + appimagetool (pinned releases)
        run: |
          set -e
          # Pinned to a stable, recent alpha so the URL doesn't depend on the
          # moving "continuous" tag and its flake-prone asset URLs.
          LINUXDEPLOY_VER=1-alpha-20251107-1
          APPIMAGETOOL_VER=continuous
          for i in 1 2 3 4 5; do
            set +e
            curl -fsSL --connect-timeout 15 --max-time 120 \
              -o linuxdeploy-x86_64.AppImage \
              "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VER}/linuxdeploy-x86_64.AppImage" \
              && break
            echo "linuxdeploy download attempt $i failed, retrying..."
            sleep 5
            set -e
          done
          for i in 1 2 3 4 5; do
            set +e
            curl -fsSL --connect-timeout 15 --max-time 120 \
              -o linuxdeploy-plugin-gtk-x86_64.AppImage \
              "https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/${LINUXDEPLOY_VER}/linuxdeploy-plugin-gtk-x86_64.AppImage" \
              && break
            echo "linuxdeploy-plugin-gtk download attempt $i failed, retrying..."
            sleep 5
            set -e
          done
          for i in 1 2 3 4 5; do
            set +e
            curl -fsSL --connect-timeout 15 --max-time 120 \
              -o appimagetool-x86_64.AppImage \
              "https://github.com/AppImage/AppImageKit/releases/download/${APPIMAGETOOL_VER}/appimagetool-x86_64.AppImage" \
              && break
            echo "appimagetool download attempt $i failed, retrying..."
            sleep 5
            set -e
          done
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk-x86_64.AppImage appimagetool-x86_64.AppImage
          ls -lh *.AppImage

      - name: Assemble AppDir
        run: |
          set -e
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp target/release/light-browser AppDir/usr/bin/mini-browser
          cp packaging/mini-browser.desktop AppDir/usr/share/applications/
          cp packaging/mini-browser.png AppDir/usr/share/icons/hicolor/256x256/apps/

          export DEPLOY_GTK_VERSION=4
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin gtk \
            --output appimage \
            --desktop-file packaging/mini-browser.desktop \
            --icon-file packaging/mini-browser.png

      - name: Rename AppImage
        run: |
          set -e
          mv Mini_Browser*.AppImage Mini-Browser-${{ github.ref_name }}-x86_64.AppImage
          ls -lh Mini-Browser-*.AppImage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Mini Browser ${{ github.ref_name }}"
          body: |
            ## Mini Browser ${{ github.ref_name }}

            Zen-inspired GTK4 browser built with Rust + WebKitGTK 6.

            ### What's new
            - Auto-hide topbar (hover top edge to reveal, like Zen browser)
            - Traffic-light window controls render as proper circles
            - New Tab label no longer leaks raw `data:` URI
            - URL bar fills center; nav buttons always visible
            - Tabs float over web content via GTK Overlay for full-bleed pages

            ### Install
            Download `Mini-Browser-${{ github.ref_name }}-x86_64.AppImage`, make executable and run:
            ```bash
            chmod +x Mini-Browser-*.AppImage
            ./Mini-Browser-*.AppImage
            ```
          files: Mini-Browser-${{ github.ref_name }}-x86_64.AppImage
          draft: false
          prerelease: false
