name: Release AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    # Ubuntu 24.04 (noble) is required: WebKitGTK 6.0 is not in 22.04's repos.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libwebkitgtk-6.0-4 \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libadwaita-1-dev \
            imagemagick \
            fuse \
            wget \
            curl \
            file \
            patchelf \
            binutils \
            desktop-file-utils \
            libfuse2 \
            gcc \
            glib-networking \
            gsettings-desktop-schemas \
            ca-certificates \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-gl \
            gstreamer1.0-alsa \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-x

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Prepare icon (force 256x256)
        # linuxdeploy rejects icons whose x/y resolution differ or aren't on its
        # whitelist (256x256 is). The source logo is 818x834; we resize + center.
        run: |
          convert packaging/mini-browser.png \
            -resize x256 \
            -resize 256x256 \
            -background none \
            -gravity center \
            -extent 256x256 \
            packaging/mini-browser-256.png
          file packaging/mini-browser-256.png

      - name: Download linuxdeploy + appimagetool
        run: |
          set -e
          # Pinned linuxdeploy so the URL is stable.
          LINUXDEPLOY_VER=1-alpha-20251107-1
          APPIMAGETOOL_VER=continuous
          for i in 1 2 3 4 5; do
            set +e
            curl -fsSL --connect-timeout 15 --max-time 300 \
              --retry 3 --retry-delay 2 \
              -o linuxdeploy-x86_64.AppImage \
              "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VER}/linuxdeploy-x86_64.AppImage" \
              && break
            echo "linuxdeploy download attempt $i failed, retrying..."
            sleep 5
            set -e
          done
          for i in 1 2 3 4 5; do
            set +e
            curl -fsSL --connect-timeout 15 --max-time 300 \
              --retry 3 --retry-delay 2 \
              -o appimagetool-x86_64.AppImage \
              "https://github.com/AppImage/AppImageKit/releases/download/${APPIMAGETOOL_VER}/appimagetool-x86_64.AppImage" \
              && break
            echo "appimagetool download attempt $i failed, retrying..."
            sleep 5
            set -e
          done
          chmod +x linuxdeploy-x86_64.AppImage appimagetool-x86_64.AppImage
          ls -lh *.AppImage

      - name: Patch linuxdeploy's embedded strip
        # linuxdeploy bundles an old binutils `strip` snapshot that doesn't
        # understand the modern `.relr.dyn` ELF section (type 0x13) used by
        # current glibc-built libraries — every strip call exits non-zero,
        # polluting the build. We extract the AppImage and replace its
        # embedded strip with the system binutils from `binutils` (above).
        run: |
          set -e
          ./linuxdeploy-x86_64.AppImage --appimage-extract > /dev/null
          cat > squashfs-root/usr/bin/strip <<'EOF'
          #!/bin/sh
          # Delegate to system strip: binutils >= 2.36 knows .relr.dyn.
          exec /usr/bin/strip "$@"
          EOF
          chmod +x squashfs-root/usr/bin/strip
          echo "Patched strip wrapper:"
          cat squashfs-root/usr/bin/strip

      - name: Assemble AppDir
        # Run linuxdeploy WITHOUT --plugin gtk and WITHOUT --output appimage.
        # linuxdeploy-plugin-gtk has no published releases (404s on every tag),
        # so we let the built-in GTK detector (DEPLOY_GTK_VERSION=4) do the
        # bundling and call appimagetool ourselves in the next step.
        run: |
          set -e
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp target/release/light-browser AppDir/usr/bin/mini-browser
          cp packaging/mini-browser.desktop AppDir/usr/share/applications/
          cp packaging/mini-browser-256.png AppDir/usr/share/icons/hicolor/256x256/apps/mini-browser.png

          # Force-include libgmp so the AppImage is fully self-contained.
          # linuxdeploy blacklists it as a "system lib", which is wrong for a
          # portable AppImage that should run on any distro.
          GMP_LIB=$(ldconfig -p | awk '/libgmp\.so\.10/ {print $NF; exit}')

          export DEPLOY_GTK_VERSION=4
          ./squashfs-root/AppRun \
            --appdir AppDir \
            --desktop-file packaging/mini-browser.desktop \
            --icon-file packaging/mini-browser-256.png \
            $([ -n "$GMP_LIB" ] && echo "--library $GMP_LIB")

          # ---- Bundle WebKitGTK 6 helper binaries --------------------------
          # The bundled libwebkitgtk-6.0.so.4 spawns WebKitNetworkProcess,
          # WebKitWebProcess, WebKitGPUProcess at the Debian multiarch path
          # /usr/lib/x86_64-linux-gnu/webkitgtk-6.0/. linuxdeploy only
          # follows direct ldd dependencies, so those libexec-style helpers
          # aren't bundled. On Debian/Ubuntu they exist system-wide, but on
          # Arch/Fedora/openSUSE the path doesn't exist and the binary aborts
          # before opening a window:
          #   ERROR: Failed to spawn child process
          #     "/usr/lib/x86_64-linux-gnu/webkitgtk-6.0/WebKitNetworkProcess"
          # Copy the helpers from the libwebkitgtk-6.0-4 package into the
          # matching AppDir path. The LD_PRELOAD shim built below rewrites
          # the spawn path so this AppDir copy is used on hosts that lack
          # the system path.
          mkdir -p AppDir/w
          for helper_dir in \
              /usr/lib/x86_64-linux-gnu/webkitgtk-6.0 \
              /usr/lib/webkitgtk-6.0 \
              /usr/lib64/webkitgtk-6.0; do
              if [ -d "$helper_dir" ]; then
                  cp -a "$helper_dir"/. AppDir/w/
              fi
          done
          if [ ! -x AppDir/w/WebKitNetworkProcess ]; then
              echo "FATAL: WebKitGTK 6 helper binaries were not found on runner" >&2
              exit 1
          fi
          echo "bundled WebKit helpers:"
          ls AppDir/w/

          # ---- Patch RPATH on the helper binaries ---------------------------
          # The helpers ship without an RPATH, so when the LD_PRELOAD shim
          # redirects spawns to the bundled copies, those processes can't find
          # their own dependencies (libwebkitgtk-6.0.so.4, libicudata.so.74,
          # libjavascriptcoregtk-6.0.so.1, ...) and exit immediately with
          # "error while loading shared libraries". The helpers live at
          #   $APPDIR/usr/lib/x86_64-linux-gnu/webkitgtk-6.0/<name>
          # and the bundled libs are at
          #   $APPDIR/usr/lib/<lib>
          # so $ORIGIN/../.. resolves from the helper to the lib dir.
          for helper in \
              AppDir/w/WebKitNetworkProcess \
              AppDir/w/WebKitWebProcess \
              AppDir/w/WebKitGPUProcess \
              AppDir/w/MiniBrowser; do
              if [ -f "$helper" ]; then
                  patchelf --set-rpath '$ORIGIN/../usr/lib' "$helper"
                  echo "patched rpath on $helper -> $(patchelf --print-rpath "$helper")"
              fi
          done

          webkit_found=0
          for webkit_lib in \
              AppDir/usr/lib/libwebkitgtk-6.0.so* \
              AppDir/usr/lib/x86_64-linux-gnu/libwebkitgtk-6.0.so*; do
              if [ -f "$webkit_lib" ]; then
                  python3 packaging/relocate-webkit.py "$webkit_lib"
                  webkit_found=1
              fi
          done
          if [ "$webkit_found" -eq 0 ]; then
              echo "FATAL: bundled libwebkitgtk-6.0 library was not found" >&2
              exit 1
          fi
          touch AppDir/w/.relocated

          mkdir -p AppDir/usr/lib/gstreamer-1.0
          for plugin_dir in \
              /usr/lib/x86_64-linux-gnu/gstreamer-1.0 \
              /usr/lib/gstreamer-1.0 \
              /usr/lib64/gstreamer-1.0; do
              if [ -d "$plugin_dir" ]; then
                  cp -a "$plugin_dir"/. AppDir/usr/lib/gstreamer-1.0/
              fi
          done
          echo "bundled GStreamer plugins: $(ls AppDir/usr/lib/gstreamer-1.0 | wc -l)"

          mkdir -p AppDir/usr/lib/gdk-pixbuf-2.0
          for loader_dir in \
              /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/* \
              /usr/lib/gdk-pixbuf-2.0/*; do
              if [ -d "$loader_dir" ]; then
                  cp -a "$loader_dir" AppDir/usr/lib/gdk-pixbuf-2.0/
              fi
          done
          echo "bundled pixbuf loaders: $(ls AppDir/usr/lib/gdk-pixbuf-2.0 | wc -l)"

          # ---- Build the LD_PRELOAD redirect shim --------------------------
          # See packaging/webkit-helper-redirect.c for the full explanation.
          # The shim intercepts execve, execv, execvp, execvpe, and
          # posix_spawn in the parent process. If the target path doesn't
          # exist on the host AND matches a webkitgtk-6.0 helper pattern AND
          # a copy exists under $APPDIR, it redirects to the bundled copy.
          # On Debian/Ubuntu the system path exists, so the shim is a no-op
          # and the system helpers are used.
          #
          # Verify after building that all five symbols are exported — gcc
          # version drift across runners has been observed to silently drop
          # some of them, which makes the shim a no-op and the browser fails
          # to start.
          gcc -shared -fPIC -O2 -Wall -Wextra \
              -o AppDir/usr/lib/libwebkit-helper-redirect.so \
              packaging/webkit-helper-redirect.c -ldl
          echo "redirect shim size: $(stat -c %s AppDir/usr/lib/libwebkit-helper-redirect.so) bytes"
          EXPORTED=$(nm -D --defined-only AppDir/usr/lib/libwebkit-helper-redirect.so | awk '{print $3}' | tr '\n' ' ')
          echo "redirect shim exported symbols: $EXPORTED"
          for sym in execve posix_spawn execvp execv execvpe; do
              if ! echo "$EXPORTED" | grep -qw "$sym"; then
                  echo "FATAL: redirect shim is missing $sym — exec interception will not work" >&2
                  exit 1
              fi
          done

          # ---- Replace linuxdeploy's AppRun symlink with our wrapper -------
          # linuxdeploy creates AppDir/AppRun as a symlink to the main
          # executable. Replace it with our wrapper script so launches from
          # a file manager (no terminal attached) get safe environment
          # defaults, the LD_PRELOAD shim above loaded, and a diagnostic log
          # file. See packaging/AppRun-wrapper.sh for details.
          rm -f AppDir/AppRun
          cp packaging/AppRun-wrapper.sh AppDir/AppRun
          chmod +x AppDir/AppRun
          echo "--- AppRun installed ---"
          head -5 AppDir/AppRun
          # ---- Fix icon for AppImage file thumbnail (every distro) ----------
          # linuxdeploy creates .DirIcon/mini-browser.png as symlinks to
          # hicolor/256x256 which some file managers (Dolphin/Nautilus
          # thumbd) don't follow. Copy real files so the icon shows
          # even before integration, on all DEs.
          rm -f AppDir/.DirIcon AppDir/mini-browser.png
          cp AppDir/usr/share/icons/hicolor/256x256/apps/mini-browser.png AppDir/.DirIcon
          cp AppDir/usr/share/icons/hicolor/256x256/apps/mini-browser.png AppDir/mini-browser.png
          # Provide additional sizes for HiDPI / older DEs
          for sz in 16 32 64 128 256; do
            mkdir -p "AppDir/usr/share/icons/hicolor/${sz}x${sz}/apps"
            if [ "$sz" != "256" ]; then
              convert packaging/mini-browser-256.png -resize "${sz}x${sz}" "AppDir/usr/share/icons/hicolor/${sz}x${sz}/apps/mini-browser.png" 2>/dev/null || \
                cp AppDir/usr/share/icons/hicolor/256x256/apps/mini-browser.png "AppDir/usr/share/icons/hicolor/${sz}x${sz}/apps/mini-browser.png"
            fi
          done
          echo "--- icons fixed ---"
          ls -lh AppDir/.DirIcon AppDir/mini-browser.png
          ls -lh AppDir/usr/share/icons/hicolor/256x256/apps/mini-browser.png
          # ---- Bundle TLS support (glib-networking + CA certs) --------------------
          # Without these HTTPS fails with “TLS support is not available”.
          mkdir -p AppDir/usr/lib/gio/modules
          mkdir -p AppDir/usr/share/glib-2.0/schemas
          mkdir -p AppDir/etc/ssl/certs
          mkdir -p AppDir/usr/share/p11-kit
          for moddir in /usr/lib/x86_64-linux-gnu/gio/modules /usr/lib/gio/modules; do
            if [ -d "$moddir" ]; then
              cp -av "$moddir"/*.so AppDir/usr/lib/gio/modules/ 2>/dev/null || true
              cp -av "$moddir"/giomodule.cache AppDir/usr/lib/gio/modules/ 2>/dev/null || true
            fi
          done
          # gio modules + schemas
          if [ -f /usr/share/glib-2.0/schemas/gschemas.compiled ]; then
            cp -av /usr/share/glib-2.0/schemas/gschemas.compiled AppDir/usr/share/glib-2.0/schemas/ 2>/dev/null || true
          fi
          if [ -d /usr/share/glib-2.0/schemas ]; then
            cp -av /usr/share/glib-2.0/schemas/*.xml AppDir/usr/share/glib-2.0/schemas/ 2>/dev/null || true
          fi
          # CA certificates
          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            cp -av /etc/ssl/certs/ca-certificates.crt AppDir/etc/ssl/certs/ 2>/dev/null || true
          fi
          cp -av /etc/ssl/certs/*.pem AppDir/etc/ssl/certs/ 2>/dev/null || true
          # p11-kit trust
          if [ -d /usr/share/p11-kit ]; then
            cp -avr /usr/share/p11-kit AppDir/usr/share/ 2>/dev/null || true
          fi
          echo "--- TLS bundled ---"
          ls -lh AppDir/usr/lib/gio/modules/ 2>&1 | head -20
          ls -lh AppDir/etc/ssl/certs/ca-certificates.crt 2>&1 | head -5
          ls -lh AppDir/usr/share/glib-2.0/schemas/gschemas.compiled 2>&1 | head -5
          echo "--- libs bundled ---"
          find AppDir/usr/lib -maxdepth 1 -name '*.so*' | wc -l

      - name: Package AppImage
        run: |
          set -e
          ./appimagetool-x86_64.AppImage \
            AppDir \
            "Mini-Browser-${GITHUB_REF_NAME}-x86_64.AppImage"
          ls -lh Mini-Browser-*.AppImage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Mini Browser ${{ github.ref_name }}"
          body: |
            ## Mini Browser ${{ github.ref_name }}

            Zen-inspired GTK4 browser built with Rust + WebKitGTK 6.

            ### What's new in v1.0.1
            - **TLS fixed**: bundle `glib-networking` `GIO_MODULE_DIR` + `ca-certificates`/`p11-kit` + `gschemas.compiled` — fixes `TLS support is not available` on Google/search.
            - **Traffic lights fixed**: `src/window.rs:1018` `background-color` → `background` + `background-image:none` so red/yellow/green dots show inside AppImage (bundled GTK theme overrode `background-color`).
            - **Dock icon fixed**: `packaging/mini-browser.desktop:12` `StartupWMClass=mini-browser` → `com.example.LightBrowser` matching `src/config.rs:3` `APP_ID`, so dash/dock shows logo not generic.
            - Icon every distro: real `AppDir/.DirIcon`/`mini-browser.png` + `16/32/64/128/256` hicolor, type-2 AppImage.

            ### Install
            Download `Mini-Browser-${{ github.ref_name }}-x86_64.AppImage`, make executable and run:
            ```bash
            chmod +x Mini-Browser-*.AppImage
            ./Mini-Browser-*.AppImage
            ```

            If double-click shows nothing, run from terminal or check `~/.local/share/mini-browser/launch.log`.
          files: Mini-Browser-${{ github.ref_name }}-x86_64.AppImage
          draft: false
          prerelease: false