name: Release AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    # Ubuntu 24.04 (noble) is required: WebKitGTK 6.0 is not in 22.04's repos.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libadwaita-1-dev \
            imagemagick \
            fuse \
            wget \
            curl \
            file \
            patchelf \
            binutils \
            desktop-file-utils \
            libfuse2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Prepare icon (force 256x256)
        # linuxdeploy rejects icons whose x/y resolution differ or aren't on its
        # whitelist (256x256 is). The source logo is 818x834; we resize + center.
        run: |
          convert packaging/mini-browser.png \
            -resize x256 \
            -resize 256x256 \
            -background none \
            -gravity center \
            -extent 256x256 \
            packaging/mini-browser-256.png
          file packaging/mini-browser-256.png

      - name: Download linuxdeploy + appimagetool
        run: |
          set -e
          # Pinned linuxdeploy so the URL is stable.
          LINUXDEPLOY_VER=1-alpha-20251107-1
          APPIMAGETOOL_VER=continuous
          for i in 1 2 3 4 5; do
            set +e
            curl -fsSL --connect-timeout 15 --max-time 300 \
              --retry 3 --retry-delay 2 \
              -o linuxdeploy-x86_64.AppImage \
              "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VER}/linuxdeploy-x86_64.AppImage" \
              && break
            echo "linuxdeploy download attempt $i failed, retrying..."
            sleep 5
            set -e
          done
          for i in 1 2 3 4 5; do
            set +e
            curl -fsSL --connect-timeout 15 --max-time 300 \
              --retry 3 --retry-delay 2 \
              -o appimagetool-x86_64.AppImage \
              "https://github.com/AppImage/AppImageKit/releases/download/${APPIMAGETOOL_VER}/appimagetool-x86_64.AppImage" \
              && break
            echo "appimagetool download attempt $i failed, retrying..."
            sleep 5
            set -e
          done
          chmod +x linuxdeploy-x86_64.AppImage appimagetool-x86_64.AppImage
          ls -lh *.AppImage

      - name: Patch linuxdeploy's embedded strip
        # linuxdeploy bundles an old binutils `strip` snapshot that doesn't
        # understand the modern `.relr.dyn` ELF section (type 0x13) used by
        # current glibc-built libraries — every strip call exits non-zero,
        # polluting the build. We extract the AppImage and replace its
        # embedded strip with the system binutils from `binutils` (above).
        run: |
          set -e
          ./linuxdeploy-x86_64.AppImage --appimage-extract > /dev/null
          cat > squashfs-root/usr/bin/strip <<'EOF'
          #!/bin/sh
          # Delegate to system strip: binutils >= 2.36 knows .relr.dyn.
          exec /usr/bin/strip "$@"
          EOF
          chmod +x squashfs-root/usr/bin/strip
          echo "Patched strip wrapper:"
          cat squashfs-root/usr/bin/strip

      - name: Assemble AppDir
        # Run linuxdeploy WITHOUT --plugin gtk and WITHOUT --output appimage.
        # linuxdeploy-plugin-gtk has no published releases (404s on every tag),
        # so we let the built-in GTK detector (DEPLOY_GTK_VERSION=4) do the
        # bundling and call appimagetool ourselves in the next step.
        run: |
          set -e
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp target/release/light-browser AppDir/usr/bin/mini-browser
          cp packaging/mini-browser.desktop AppDir/usr/share/applications/
          cp packaging/mini-browser-256.png AppDir/usr/share/icons/hicolor/256x256/apps/mini-browser.png

          # Force-include libgmp so the AppImage is fully self-contained.
          # linuxdeploy blacklists it as a "system lib", which is wrong for a
          # portable AppImage that should run on any distro.
          GMP_LIB=$(ldconfig -p | awk '/libgmp\.so\.10/ {print $NF; exit}')

          export DEPLOY_GTK_VERSION=4
          ./squashfs-root/AppRun \
            --appdir AppDir \
            --desktop-file packaging/mini-browser.desktop \
            --icon-file packaging/mini-browser-256.png \
            $([ -n "$GMP_LIB" ] && echo "--library $GMP_LIB")

          echo "--- libs bundled ---"
          find AppDir/usr/lib -maxdepth 1 -name '*.so*' | wc -l

      - name: Package AppImage
        run: |
          set -e
          ./appimagetool-x86_64.AppImage \
            AppDir \
            "Mini-Browser-${GITHUB_REF_NAME}-x86_64.AppImage"
          ls -lh Mini-Browser-*.AppImage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Mini Browser ${{ github.ref_name }}"
          body: |
            ## Mini Browser ${{ github.ref_name }}

            Zen-inspired GTK4 browser built with Rust + WebKitGTK 6.

            ### What's new
            - Auto-hide topbar (hover top edge to reveal, like Zen browser)
            - Traffic-light window controls render as proper circles
            - New Tab label no longer leaks raw `data:` URI
            - URL bar fills center; nav buttons always visible
            - Tabs float over web content via GTK Overlay for full-bleed pages

            ### Install
            Download `Mini-Browser-${{ github.ref_name }}-x86_64.AppImage`, make executable and run:
            ```bash
            chmod +x Mini-Browser-*.AppImage
            ./Mini-Browser-*.AppImage
            ```
          files: Mini-Browser-${{ github.ref_name }}-x86_64.AppImage
          draft: false
          prerelease: false
