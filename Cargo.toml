[package]
name = "light-browser"
version = "1.4.0"
edition = "2021"
description = "Lightweight native Linux browser built with Rust + GTK4 + WebKitGTK 6.0"
authors = ["Mini Browser Contributors"]
license = "MIT"

[dependencies]
gtk4 = "0.10"

[build-dependencies]
pkg-config = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
