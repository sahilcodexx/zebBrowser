<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command Palette</title>
  <link rel="stylesheet" href="./palette.css" />
</head>
<body>
  <div id="palette" class="hidden" role="dialog" aria-modal="true" aria-label="Command palette">
    <div id="palette-backdrop"></div>
    <div id="palette-card">
      <div id="palette-input-wrap">
        <span id="palette-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
        </span>
        <input id="palette-input" type="text" placeholder="Search Google or type a URL..." spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" autofocus />
        <span id="palette-esc" aria-hidden="true">ESC</span>
      </div>
      <div id="palette-results" role="listbox" aria-label="Commands"></div>
      <div id="palette-footer">
        <span>Press <kbd>↵</kbd> to select</span>
        <span><kbd>↑</kbd> <kbd>↓</kbd> to navigate</span>
        <span><kbd>ESC</kbd> to close</span>
      </div>
    </div>
  </div>

  <script src="./palette.js"></script>
</body>
</html>
